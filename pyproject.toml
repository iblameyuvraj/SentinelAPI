[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelapi"
version = "1.0.0"
description = "API Security & Zero-Trust Vulnerability Scanner"
readme = "README.md"
authors = [{ name = "Yuvraj" }]
dependencies = [
    "rich>=13.8.0",
    "questionary>=2.0.1",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "reportlab>=4.0.0",
    "pillow>=10.0.0",
]

[project.scripts]
sentinel = "sentinelapi.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinelapi*"]
