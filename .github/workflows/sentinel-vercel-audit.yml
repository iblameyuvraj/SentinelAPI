name: SentinelAPI Preview Deployment & OpenAPI Security Audit

on:
  push:
    branches: [ deployment, main ]
  pull_request:
    branches: [ deployment, main ]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optional override target URL (leave empty to deploy/resolve Vercel preview)'
        required: false
        default: ''
      merge_backend:
        description: 'Merge all backend modular test case OpenAPI specs'
        type: boolean
        default: false

jobs:
  security-audit:
    name: OWASP API Security Audit & Preview CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies & SentinelAPI
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: 🛠️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Vercel CLI & Tools
        run: |
          npm install -g vercel@latest
          sudo apt-get update && sudo apt-get install -y jq curl

      - name: 📝 Generate & Validate Dynamic OpenAPI Specifications
        id: generate-openapi
        run: |
          echo "Generating base OpenAPI specification..."
          python scripts/generate_openapi.py \
            --source sandbox_openapi.json \
            --output sandbox_openapi.json

          echo "Generating consolidated modular backend OpenAPI specification for all N test suites..."
          python scripts/generate_openapi.py \
            --merge-backend \
            --backend-dir backend \
            --output generated_backend_openapi.json

      - name: 📄 Upload Generated OpenAPI Specifications
        uses: actions/upload-artifact@v4
        with:
          name: sentinelapi-openapi-specifications
          path: |
            sandbox_openapi.json
            generated_backend_openapi.json
          retention-days: 14

      - name: 🚀 Deploy Preview to Vercel & Extract URL
        id: preview-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          OVERRIDE_URL: ${{ github.event.inputs.target_url }}
        run: |
          echo "========================================================"
          echo "🌐 ESTABLISHING PREVIEW DEPLOYMENT TARGET"
          echo "========================================================"
          
          PREVIEW_URL=""

          # 1. Manual Dispatch Override (if provided)
          if [ -n "$OVERRIDE_URL" ]; then
            PREVIEW_URL="$OVERRIDE_URL"
            echo "✓ Using manual target URL override: $PREVIEW_URL"
          fi

          # 2. Vercel Preview Deploy & API Resolution
          if [ -z "$PREVIEW_URL" ] && [ -n "$VERCEL_TOKEN" ]; then
            echo "ℹ️  Querying Vercel API for latest ready preview deployment on project $VERCEL_PROJECT_ID..."
            TEAM_PARAM=""
            if [ -n "$VERCEL_ORG_ID" ]; then
              TEAM_PARAM="&teamId=$VERCEL_ORG_ID"
            fi
            
            API_RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}${TEAM_PARAM}&limit=5")
            
            # First try latest ready deployment URL
            READY_URL=$(echo "$API_RESP" | jq -r '.deployments[] | select(.readyState=="READY") | .url' | head -n 1)
            if [ -n "$READY_URL" ] && [ "$READY_URL" != "null" ]; then
              PREVIEW_URL="https://$READY_URL"
              echo "✓ Resolved live Vercel Preview URL from Vercel API: $PREVIEW_URL"
            else
              # Fallback to project alias
              PROJECT_INFO=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?${TEAM_PARAM#&}")
              PRIMARY_ALIAS=$(echo "$PROJECT_INFO" | jq -r '.targets.production.alias[0] // empty')
              if [ -n "$PRIMARY_ALIAS" ] && [ "$PRIMARY_ALIAS" != "null" ]; then
                PREVIEW_URL="https://$PRIMARY_ALIAS"
                echo "✓ Resolved live accessible Vercel target via Project Alias: $PREVIEW_URL"
              fi
            fi
          fi

          # 3. Fallback: Ephemeral Local Preview Server (Zero-Dependency CI)
          if [ -z "$PREVIEW_URL" ]; then
            echo "⚠️  No Vercel deployment available; launching ephemeral local mock preview server..."
            node backend/Authentication_Misconfiguration/vulnerable-auth.js &
            SERVER_PID=$!
            echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
            sleep 2
            PREVIEW_URL="http://127.0.0.1:8004"
            echo "✓ Ephemeral Mock Preview Server running at: $PREVIEW_URL"
          fi

          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "LIVE_PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV

      - name: 🔄 Re-Generate OpenAPI Specification with Live Preview URL
        run: |
          echo "Injecting live preview URL into OpenAPI specification..."
          python scripts/generate_openapi.py \
            --source sandbox_openapi.json \
            --base-url "${{ steps.preview-deploy.outputs.preview_url }}" \
            --output sandbox_openapi.json

      - name: 🐳 Build SentinelAPI Docker Container
        run: |
          echo "Building SentinelAPI production security container..."
          docker build -t sentinelapi .

      - name: 🛡️ Run SentinelAPI Non-Interactive Master Scan
        id: sentinel-scan
        env:
          PREVIEW_URL: ${{ steps.preview-deploy.outputs.preview_url }}
          BEARER_TOKEN: ${{ secrets.AUDIT_BEARER_TOKEN }}
          CUSTOM_LLM_BASE_URL: ${{ secrets.CUSTOM_LLM_BASE_URL }}
          CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
          SENTINEL_AI_PROVIDER: ${{ secrets.SENTINEL_AI_PROVIDER }}
          SENTINEL_AI_MODEL: ${{ secrets.SENTINEL_AI_MODEL }}
          CUSTOM_LLM_MODEL: ${{ secrets.CUSTOM_LLM_MODEL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
        run: |
          mkdir -p markdown
          
          SCAN_CODE=0
          docker run --rm \
            --network host \
            -e CUSTOM_LLM_BASE_URL="$CUSTOM_LLM_BASE_URL" \
            -e CUSTOM_LLM_API_KEY="$CUSTOM_LLM_API_KEY" \
            -e SENTINEL_AI_PROVIDER="$SENTINEL_AI_PROVIDER" \
            -e SENTINEL_AI_MODEL="$SENTINEL_AI_MODEL" \
            -e CUSTOM_LLM_MODEL="$CUSTOM_LLM_MODEL" \
            -e BREVO_API_KEY="$BREVO_API_KEY" \
            -e BREVO_SENDER_EMAIL="$BREVO_SENDER_EMAIL" \
            -e BREVO_SENDER_NAME="$BREVO_SENDER_NAME" \
            -e ALERT_RECIPIENT_EMAIL="$ALERT_RECIPIENT_EMAIL" \
            -v "$PWD/markdown:/app/markdown" \
            sentinelapi \
            --spec sandbox_openapi.json \
            --base-url "$PREVIEW_URL" \
            --token "$BEARER_TOKEN" \
            --cookie "$COOKIE_STRING" \
            --ci || SCAN_CODE=$?

          echo "scan_exit_code=$SCAN_CODE" >> $GITHUB_OUTPUT
          
          echo "========================================================"
          echo "📊 AUDIT CONCLUSION CODE: $SCAN_CODE"
          if [ "$SCAN_CODE" -eq 0 ]; then
            echo "🟢 CONCLUSION: 0 (PASS - No vulnerabilities detected)"
          elif [ "$SCAN_CODE" -eq 1 ]; then
            echo "🔴 CONCLUSION: 1 (FAIL - Vulnerabilities confirmed)"
          else
            echo "🟡 CONCLUSION: 2 (ERROR - Target unreachable or probe failure)"
          fi
          echo "========================================================"

      - name: 📄 Upload Security Reports (PDF & Markdown)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinelapi-security-reports
          path: |
            markdown/*.pdf
            markdown/*.md
            markdown/*.json
          retention-days: 14

      - name: 💬 Post Security Findings on Pull Request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const exitCode = '${{ steps.sentinel-scan.outputs.scan_exit_code }}';
            const previewUrl = '${{ steps.preview-deploy.outputs.preview_url }}';
            
            let statusBadge = '🟢 **PASS (0)**';
            let summaryMessage = 'All security probes passed cleanly! No high/critical vulnerabilities confirmed.';
            
            if (exitCode === '1') {
              statusBadge = '🔴 **FAIL (1)**';
              summaryMessage = '⚠️ **Security vulnerabilities detected.** Review attached PDF and Markdown reports for reproduction curl PoCs.';
            } else if (exitCode === '2') {
              statusBadge = '🟡 **ERROR (2)**';
              summaryMessage = '⚠️ **Host unreachable or scan failed to execute.**';
            }

            const body = `### 🛡️ SentinelAPI Security Audit Summary
            - **Target Preview URL:** \`${previewUrl}\`
            - **Audit Conclusion:** ${statusBadge}
            - **Result Details:** ${summaryMessage}
            - **Spec Audited:** \`sandbox_openapi.json\` (Dynamic OpenAPI 3.0)
            - **Artifacts:** PDF logs & vulnerability remediation blueprints attached to workflow run.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: 🚦 Enforce CI Gate (Fail on Exit Code != 0)
        run: |
          EXIT_CODE=${{ steps.sentinel-scan.outputs.scan_exit_code }}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Security Audit Gate Failed with Conclusion Code: $EXIT_CODE"
            exit "$EXIT_CODE"
          fi
          echo "✅ Security Audit Gate Passed cleanly (Conclusion: 0)"
